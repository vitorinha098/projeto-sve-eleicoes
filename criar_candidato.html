<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVE - Gestão de Candidatos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f7f6;
        font-family: "Segoe UI", sans-serif;
      }
      .card-admin {
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .btn-registo {
        font-weight: 600;
        padding: 12px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card card-admin p-4">
            <h2 class="text-center mb-4 text-primary">Registar Novo Candidato</h2>
            <p class="text-center text-muted mb-4">Preencha os dados abaixo para adicionar um candidato à eleição ativa.</p>

            <form id="formCandidato">
              <!-- Nome -->
              <div class="mb-3">
                <label class="form-label fw-bold">Nome Completo</label>
                <input type="text" id="nome" class="form-control" placeholder="Ex: Maria Silva" required/>
              </div>


              <div class="mb-3">
                <label class="form-label fw-bold">Nome do Partido / Coligação</label>
                <input type="text" id="nome_partido" class="form-control" placeholder="Ex: Aliança Democrática, Partido Socialista..." />
              </div>

              <div class="row">
                <!-- Género -->
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Género</label>
                  <select id="genero" class="form-select">
                    <option value="">Não especificado</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                  </select>
                </div>
                <!-- Data Nasc -->
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Data de Nascimento</label>
                  <input type="date" id="data_nasc" class="form-control"/>
                </div>
              </div>

              <!-- Descrição -->
              <div class="mb-3">
                <label class="form-label fw-bold">Biografia / Descrição (Opcional)</label>
                <textarea id="descricao" class="form-control" rows="3" placeholder="Breve percurso político..."></textarea>
              </div>  

              <!-- Foto Candidato -->
              <div class="mb-3">
                <label class="form-label fw-bold">Fotografia do Candidato</label>
                <input type="file" id="foto_candidato" class="form-control" accept="image/*" required/>
                <div class="form-text">Formatos aceites: JPG, PNG.</div>
              </div>
              <!-- Foto Partido -->
              <div class="mb-3">
                <label class="form-label fw-bold">Logo do Partido</label>
                <input type="file" id="logo_partido" class="form-control" accept="image/*"/>
                <div class="form-text">Formatos aceites: JPG, PNG.</div>
              </div>

              <!-- Botão Submeter -->
              <button type="submit" class="btn btn-primary w-100 btn-registo mt-3">Criar Candidato e Publicar</button>

              <a href="login.html" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Voltar ao Início</a>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("formCandidato").onsubmit = async (e) => {
        e.preventDefault();

        // Usamos FormData porque estamos a enviar um ficheiro (imagem)
        const formData = new FormData();
        formData.append("nome_completo", document.getElementById("nome").value);
        formData.append("nome_partido", document.getElementById("nome_partido").value);
        formData.append("genero", document.getElementById("genero").value);
        formData.append("data_nascimento", document.getElementById("data_nasc").value);
        formData.append("descricao", document.getElementById("descricao").value);

        const inputFoto = document.getElementById("foto_candidato");
        const inputLogo = document.getElementById("logo_partido");

        if (inputFoto.files[0]) formData.append("foto_candidato", inputFoto.files[0]);
        if (inputLogo.files[0]) formData.append("logo_partido", inputLogo.files[0]);

        try {
          const response = await fetch("https://projeto-sve-eleicoes.onrender.com/criar-candidato", {
              method: "POST",
              body: formData, 
            },
          );

          const result = await response.json();

          if (result.success) {
            alert("Sucesso! O candidato já está disponível para votação.");
            window.location.href = "resultados.html";
          } else {
            alert("Erro ao criar: " + result.message);
          }
        } catch (error) {
          console.error("Erro de rede:", error);
          alert("Não foi possível ligar ao servidor.");
        }
      };
  </script>
  </body>
</html>
