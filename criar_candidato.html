<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="text-center mb-4">Novo Candidato</h2>
        <form id="formCandidato">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Género</label>
                    <select id="genero" class="form-select">
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="date" id="data_nasc" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea id="descricao" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Fotografia</label>
                <input type="file" id="foto" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registar Candidato</button>
        </form>
    </div>
</div>

<script>
document.getElementById('formCandidato').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('nome_completo', document.getElementById('nome').value);
    formData.append('genero', document.getElementById('genero').value);
    formData.append('data_nascimento', document.getElementById('data_nasc').value);
    formData.append('descricao', document.getElementById('descricao').value);
    formData.append('foto', document.getElementById('foto').files[0]);

    const res = await fetch('http://localhost:8000/criar-candidato', {
        method: 'POST',
        body: formData // FormData envia ficheiros automaticamente
    });
    const result = await res.json();
    alert(result.message);
    if(result.success) window.location.href = 'resultados.html';
};
</script>
</body>
</html>
