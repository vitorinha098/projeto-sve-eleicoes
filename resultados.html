<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVE - Resultados em Tempo Real</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f4f6f8;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .container { margin-top: 50px; max-width: 820px; }
    .card-resultados {
      border: none; border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      background: white; padding: 40px;
    }
    .header-title { color: #0d6efd; font-weight: 800; text-align: center; margin-bottom: 4px; }

    /* Linha de resultado */
    .resultado-item { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

    /* Círculos de imagem */
    .logo-circulo {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid #dee2e6; background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: #6c757d;
      overflow: hidden; flex-shrink: 0;
    }
    .logo-circulo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .logos-grupo { display: flex; gap: 5px; flex-shrink: 0; }

    /* Nome e partido */
    .nome-bloco { min-width: 140px; max-width: 140px; }
    .nome-bloco .nome { font-size: 13px; font-weight: 600; color: #212529; line-height: 1.3; }
    .nome-bloco .partido { font-size: 11px; color: #6c757d; }

    /* Barra */
    .barra-container { flex: 1; display: flex; align-items: center; gap: 10px; }
    .barra-track {
      flex: 1; height: 24px;
      background: #e9ecef; border-radius: 6px; overflow: hidden;
    }
    .barra-fill {
      height: 100%; border-radius: 6px;
      display: flex; align-items: center; padding-left: 8px;
      font-size: 12px; font-weight: 600; color: white;
      transition: width 0.5s ease;
    }
    .votos-label { font-size: 12px; font-weight: 500; color: #6c757d; min-width: 60px; text-align: right; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-resultados">
      <h1 class="header-title">Resultados Parciais</h1>
      <p class="text-center text-muted mb-5">
        Dados obtidos em tempo real do servidor SVE
      </p>

      <div id="listaResultados">
        <div class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">A carregar...</span>
          </div>
        </div>
      </div>

      <div class="text-center py-2">
        <h5 class="text-secondary">
          Total de Votos na Urna:
          <span id="totalGlobal" class="badge bg-dark">0</span>
        </h5>
      </div>

      <button
        onclick="sair()"
        class="btn btn-outline-secondary w-100 btn-sair"
      >
        Sair do Sistema
      </button>

      <hr />

      <p class="text-center text-muted small mt-3">
        Os resultados são atualizados a cada acesso.
      </p>
    </div>
  </div>

  <script>
    window.onload = async function () {
      await carregarResultados();
    };

    async function carregarResultados() {
      const container = document.getElementById("listaResultados");
      console.log("1. Iniciei a função. O container é:", container);

      try {
        console.log("2. A tentar fazer fetch ao servidor...");
        const response = await fetch("http://localhost:8000/resultados");

        console.log(
          "3. Resposta do servidor recebida. Status:",
          response.status,
        );

        if (!response.ok) throw new Error("Erro ao contactar servidor");

        const dados = await response.json();

        // Isto ajuda-te a ver no F12 se os dados estão a chegar bem
        console.log("4. Dados recebidos do servidor:");
        console.table(dados);

        if (!dados || dados.length === 0) {
          console.warn("4a. A lista de dados veio vazia!");
          container.innerHTML =
            "<div class='alert alert-info text-center'>Ainda não existem votos registados.</div>";
          return;
        }

        console.log(
          "5. Teste da primeira linha: Nome =",
          dados[0].nome_completo,
          "| Votos =",
          dados[0].total_votos,
        );

        // Calcular total de votos (garantindo que tratamos valores nulos como 0)
        const totalVotosGlobal = dados.reduce(
          (sum, item) => sum + (item.total_votos || 0),
          0,
        );
        console.log("6. Total de votos somado:", totalVotosGlobal);

        document.getElementById("totalGlobal").innerText = totalVotosGlobal;

        let html = "";
        // Paleta de cores para as barras
        const cores = ["#0d6efd","#198754","#dc3545","#fd7e14","#6f42c1","#20c997"];

        dados.forEach((item, i) => {
          const nome    = item.nome_completo || "Sem Nome";
          const partido = item.nome_partido  || "Independente";
          const votos   = item.total_votos   || 0;
          const pct     = totalVotosGlobal > 0 ? Math.round((votos / totalVotosGlobal) * 100) : 0;
          const cor     = cores[i % cores.length];

          const urlBase = "http://localhost:8000/img/";

          const imgPartido = item.logo_partido 
            ? `<img src="${urlBase}${item.logo_partido}" onerror="this.style.display='none'">` 
            : item.nome_partido ? item.nome_partido.charAt(0) : "I";

        
          const imgCandidato = item.foto_candidato 
            ? `<img src="${urlBase}${item.foto_candidato}" onerror="this.style.display='none'">` 
            : item.nome_completo ? item.nome_completo.charAt(0) : "C";

          html += `
            <div class="resultado-item">
              <div class="logos-grupo">
                <div class="logo-circulo" title="${partido}">${imgPartido}</div>
                <div class="logo-circulo" title="${nome}">${imgCandidato}</div>
              </div>
              <div class="nome-bloco">
                <div class="nome">${nome}</div>
                <div class="partido">${partido}</div>
              </div>
              <div class="barra-container">
                <div class="barra-track">
                  <div class="barra-fill" style="width:${pct}%; background:${cor};">
                    ${pct > 8 ? pct + '%' : ''}
                  </div>
                </div>
                <span class="votos-label">${votos.toLocaleString('pt-PT')} v</span>
              </div>
            </div>
          `;
        });
        
        container.innerHTML = html;
        console.log("8. Injeção concluída!");
      } catch (error) {
        console.error("Erro detalhado:", error);
        container.innerHTML = `
              <div class='alert alert-danger text-center shadow-sm'>
                  <strong>Erro de Ligação</strong><br>
                  O servidor não enviou os dados. Verifique o terminal do Node.js.
              </div>`;
      }
    }

    function sair() {
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
