<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>SVE - Boletim de Voto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde-gov: #00441b;
        --ouro: #ffc107;
      }
      body {
        background-color: #f0f2f5;
      }
      .navbar {
        background-color: var(--verde-gov) !important;
        border-bottom: 4px solid var(--ouro);
      }
      .card-candidato {
        border-radius: 15px;
        transition: 0.3s;
        background: white;
        border: none;
      }
      .card-candidato:hover {
        transform: translateY(-5px);
        shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .img-container {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .img-partido {
        max-height: 100%;
        object-fit: contain;
      }
      .btn-votar {
        background-color: var(--verde-gov);
        color: white;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold">SVE - SISTEMA DE VOTO</span>
        <span class="text-white"
          >Bem-vindo(a),
          <span id="exibirEleitor" class="text-warning">...</span></span
        >
      </div>
    </nav>

    <div class="container text-center">
      <h2 class="mb-5">Boletim de Voto Oficial</h2>
      <div id="listaCandidatos" class="row g-4 justify-content-center">
        <!-- Candidatos aparecem aqui -->
      </div>
    </div>

    <script>
      async function carregarCandidatos() {
        const container = document.getElementById("listaCandidatos");
        const nomeEleitor = localStorage.getItem("nomeEleitor");
        document.getElementById("exibirEleitor").innerText =
          nomeEleitor || "Utilizador";

        try {
          const response = await fetch("http://localhost:8000/candidatos");
          const candidatos = await response.json();
          container.innerHTML = "";

          candidatos.forEach((c) => {
            container.innerHTML += `
                    <div class="col-md-4">
                        <div class="card card-candidato p-4 shadow-sm">
                            <div class="img-container mb-3">
                                <img src="http://localhost:8000/${c.foto}" class="img-partido">
                            </div>
                            <h4 class="fw-bold">${c.nome_completo}</h4>
                            <p class="text-muted small">${c.nome_partido}</p>
                            <button class="btn btn-votar w-100" onclick="confirmarVoto(${c.id_candidato}, '${c.nome_completo}')">VOTAR</button>
                        </div>
                    </div>`;
          });
        } catch (error) {
          container.innerHTML =
            "<div class='alert alert-danger'>Erro ao carregar candidatos.</div>";
        }
      }

      function confirmarVoto(id, nome) {
        if (confirm(`Confirma o seu voto em ${nome}?`)) processarVoto(id);
      }

      async function processarVoto(idCandidato) {
        const idEleitor = localStorage.getItem("idEleitor");
        try {
          const response = await fetch("http://localhost:8000/votar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id_candidato: idCandidato,
              idEleitor: idEleitor,
              id_eleicao: 1,
            }),
          });

          const result = await response.json();

          if (response.ok && result.success) {
            alert("Voto registado com sucesso!");
            window.location.href = "resultados.html";
          } else {
            if (
              result.message.includes("Já votou") ||
              result.message.includes("Duplicate entry")
            ) {
              alert(
                "Atenção: O seu voto já se encontra registado no sistema para esta eleição!",
              );
              window.location.href = "resultados.html";
            } else {
              alert("Erro: " + result.message);
              window.location.href = "resultados.html";
            }
          }
        } catch (error) {
          console.error("Erro de rede:", error);
          alert("Não foi possível contactar o servidor.");
        }
      }

      window.onload = carregarCandidatos;
    </script>
  </body>
</html>
